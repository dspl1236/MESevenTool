name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pytest pyflakes pyinstaller PyQt5
          pip install -e .

      - name: Lint
        run: python -m pyflakes meseventool/ app/

      - name: Run tests
        run: pytest tests/ -q

      # Build from the spec: it is what bundles reference/*.json and *.xdf.
      # The ad-hoc command line this replaced shipped an EXE without the XDF
      # data, so every ROM silently got the PROVISIONAL fallback maps (F1).
      - name: Build Windows EXE
        run: pyinstaller --clean --noconfirm meseventool_gui.spec

      # The built EXE must be able to load its bundled XDF definitions.
      # --selftest exits 0 only when reference/xdf_tables.json is found and
      # the confirmed 06A906032DL tables resolve.
      - name: Verify EXE
        shell: cmd
        run: |
          if not exist dist\MESevenTool.exe (echo MISSING && exit /b 1)
          dist\MESevenTool.exe --selftest
          if errorlevel 1 (echo SELFTEST FAILED && exit /b 1)
          echo selftest ok

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true
          gh release create latest \
            --title "MESevenTool — Latest Build" \
            --notes "Bosch ME7.x ROM editor and patch tool. Download and run." \
            "dist/MESevenTool.exe"
