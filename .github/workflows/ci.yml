name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install pytest
          pip install -e .
      - name: Run tests
        run: pytest tests/ -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyflakes
      - run: python -m pyflakes meseventool/

  build-windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyinstaller PyQt5
          pip install -e .

      - name: Build Windows EXE
        run: |
          pyinstaller --onefile --windowed --name MESevenTool `
            --hidden-import meseventool `
            --hidden-import meseventool.rom `
            --hidden-import meseventool.needle `
            --hidden-import meseventool.dpp `
            --hidden-import meseventool.checksum `
            --hidden-import meseventool.maps `
            --hidden-import meseventool.patches `
            --hidden-import meseventool.profiles `
            --hidden-import meseventool.ecu_id `
            --hidden-import meseventool.xdf `
            --hidden-import meseventool.kwp `
            --hidden-import meseventool.version `
            --exclude-module tkinter `
            --exclude-module matplotlib `
            --exclude-module numpy `
            app/main.py

      - name: Verify EXE
        run: if not exist dist\MESevenTool.exe (echo MISSING && exit /b 1)
        shell: cmd

      - name: Delete old latest release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true

      - name: Create latest release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest ^
            --title "MESevenTool — Latest Build" ^
            --notes "## MESevenTool^

          Bosch ME7.x ROM editor and patch tool.^

          Download MESevenTool.exe and run — no install needed.^

          Supports ME7.1, ME7.1.1, ME7.5 across 1.8T, 2.7T biturbo, V8, VR6.^

          Commit: ${{ github.sha }}" ^
            "dist/MESevenTool.exe"
        shell: cmd
